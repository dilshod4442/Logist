{% extends 'base.html' %}{% load ui %}{% block content %}<section class="form-page"><form method="post" enctype="multipart/form-data" class="content-form" {% if upload %}data-upload-form{% endif %}>{% csrf_token %}<p class="eyebrow">{% ui "form_dashboard" %}</p><h1>{{ title }}</h1>{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}</label>{% endfor %}<div class="upload-progress" hidden><span></span></div><button class="button">{% ui "save" %}</button></form></section>{% endblock %}
